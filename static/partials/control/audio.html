            <small class="control-scene-caption">เลือกเสียงและโหมดเล่นเพื่อผ่อนคลาย</small>
            <div class="stream-player" aria-label="เครื่องเล่นเสียงบรรยากาศ">
              <div class="stream-now-playing">
                <div id="unifiedAlbumArt" class="stream-cover" data-tone="0" aria-hidden="true"><span>♪</span><i></i><div class="stream-equalizer"><i></i><i></i><i></i><i></i></div></div>

              </div>
              <div class="stream-controls" aria-label="ควบคุมการเล่นเพลง">

                <button id="unifiedAudioBtn" class="stream-control stream-play ui-transport-button" onclick="unifiedAudioToggle(this)" aria-label="เล่นเสียงใน ZEEP" title="เล่นเสียงใน ZEEP"><svg id="unifiedAudioPlayIcon" class="ui-icon" aria-hidden="true"><use href="#ui-icon-play"/></svg><small id="unifiedAudioPlayLabel">เล่น</small></button>

              </div>
            </div>
