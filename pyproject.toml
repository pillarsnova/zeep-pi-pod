[tool.ruff]
target-version = "py311"
line-length = 88
include = [
    "acoustics/**/*.py",
    "adaptive/**/*.py",
    "api/**/*.py",
    "common/**/*.py",
    "hardware/**/*.py",
    "identity/**/*.py",
    "operations/**/*.py",
    "presentation/**/*.py",
    "safety/**/*.py",
    "sensors/**/*.py",
    "sessions/**/*.py",
]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
