[platformio]
default_envs = release
core_dir = .pio-core

[env]
; Pin the ESP-IDF 5.5.1 runtime family used by the known-good Production
; firmware. Reproducible audio validation must not depend on a floating
; `stable` toolchain while the DSP candidate is under measurement.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
board = zeep_sensorhub1_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions/zeep_production_16mb.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=0
    -D ZEEP_FIRMWARE_VERSION=\"sensorhub1-smart-ear-v0.5.3-debug\"
lib_deps =
    bblanchon/ArduinoJson@7.4.3

[env:release]
build_type = release
