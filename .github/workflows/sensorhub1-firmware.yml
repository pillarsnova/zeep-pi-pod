name: Sensor Hub 1 firmware

on:
  pull_request:
    paths:
      - "firmware/sensorhub1-esp32s3/**"
      - ".github/workflows/sensorhub1-firmware.yml"
  push:
    branches: [develop]
    paths:
      - "firmware/sensorhub1-esp32s3/**"
      - ".github/workflows/sensorhub1-firmware.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check "platformio==6.1.18"
      - name: Run DSP, calibration and Pi-contract tests
        run: >-
          python -m unittest discover
          -s firmware/sensorhub1-esp32s3/test -v
      - name: Build ESP32-S3 N16R8 release image
        working-directory: firmware/sensorhub1-esp32s3
        run: pio run -e release
      - name: Export and verify Flash artifacts
        working-directory: firmware/sensorhub1-esp32s3
        run: |
          ./tools/export_artifacts.sh release
          cd dist/release
          sha256sum --check MANIFEST.sha256
