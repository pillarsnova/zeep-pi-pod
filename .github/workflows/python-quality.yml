name: Python architecture and style

on:
  pull_request:
    paths:
      - "**.py"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - ".github/workflows/python-quality.yml"
  push:
    branches: [develop]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - ".github/workflows/python-quality.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime and quality dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Check extracted package style
        run: |
          ruff check acoustics adaptive api common hardware identity operations presentation safety sensors sessions
          ruff format --check acoustics adaptive api common hardware identity operations presentation safety sensors sessions
      - name: Run regression suite
        run: python -m unittest discover -q
      - name: Check generated interface
        run: python ui_composer.py check
