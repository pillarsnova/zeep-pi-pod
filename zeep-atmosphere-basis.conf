[Service]
# ZEEP internal operating alert policy. This drop-in makes the active Pi
# publish the same frozen basis used by Dashboard/Admin and Safety Supervisor.
Environment="SAFETY_THRESHOLD_BASIS_VERSION=ZEEP-ATMOSPHERE-OPS-v1.0"
Environment="SAFETY_THRESHOLD_BASIS_APPROVED=1"
Environment="SAFETY_CO2_WARN_PPM=1000"
Environment="SAFETY_CO2_FAIR_MAX_PPM=1150"
Environment="SAFETY_CO2_CRITICAL_PPM=1300"
Environment="SAFETY_TEMP_WARN_MIN_C=17"
Environment="SAFETY_TEMP_WARN_MAX_C=28"
Environment="SAFETY_TEMP_CRITICAL_MIN_C=13"
Environment="SAFETY_TEMP_CRITICAL_MAX_C=32"
