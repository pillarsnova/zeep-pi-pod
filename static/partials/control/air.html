              <span><b>แอร์ ZEEP</b><small id="airconComfortCaption">แอร์ปิดอยู่</small></span>

            <small class="control-scene-caption">ทำความเย็นและกระจายลมทั่ว ZEEP</small>
            <div class="aircon-control-stack">
              <div class="aircon-power-pair" role="group" aria-label="เปิดหรือปิดเครื่องปรับอากาศ">
                <button id="unifiedAirconPowerBtn" class="smart-switch action-toggle visual-power-toggle stateful-content aircon-action aircon-power-toggle state-unknown" data-control-label="เปิดหรือปิดแอร์" data-aircon-command="on" onclick="unifiedAirconPowerToggle(this)" aria-pressed="false" aria-label="เปิดเครื่องปรับอากาศ" title="เปิดเครื่องปรับอากาศ"><span class="toggle-status-icon" aria-hidden="true"><svg class="ui-icon"><use href="#ui-icon-power"/></svg></span><span class="toggle-state-copy"><b data-action-label>เปิด</b><small data-state-label>ยังไม่ทราบ</small></span><small class="control-button-caption">แอร์</small></button>
